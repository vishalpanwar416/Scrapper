apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapper-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrapper-frontend
  template:
    metadata:
      labels:
        app: scrapper-frontend
    spec:
      containers:
        - name: frontend
          image: scrapper-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://scrapper-backend:5000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
